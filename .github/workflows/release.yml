name: Release

# Triggered by a `v*` tag (pushed by `make patch|minor|major`). Builds the
# `cordn-server` binary for each target and attaches the archives + checksums
# to the GitHub Release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --features server --target ${{ matrix.target }} -p cordn-server
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../cordn-server-${{ matrix.target }}.tar.gz cordn-server
      - uses: actions/upload-artifact@v4
        with:
          name: cordn-server-${{ matrix.target }}
          path: cordn-server-${{ matrix.target }}.tar.gz

  # Multi-arch Docker image → GHCR. Independent Rust build (no dependency on
  # the `build` job's release artifacts), so it runs in parallel.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tags
        id: t
        run: |
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          v="${GITHUB_REF_NAME#v}"
          echo "tags=ghcr.io/${repo}/cordn-server:${v},ghcr.io/${repo}/cordn-server:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.t.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum *.tar.gz > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
