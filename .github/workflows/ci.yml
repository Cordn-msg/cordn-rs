name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt + clippy + test run on default features: cordn-core (everything) and
  # cordn-server's rmcp-free adapter/config/tests. The rmcp glue (methods.rs /
  # main.rs) is covered by the `server` job below.
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  # The full server binary: rmcp glue + contextvm-sdk (from crates.io since
  # 0.2.1). Lints + compiles methods.rs / main.rs.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --features server --all-targets -- -D warnings

  # Guard the declared MSRV (rust-version = "1.88").
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --all-targets
